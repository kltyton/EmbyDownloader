name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install WiX Toolset (for exe installer)
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wix) {
            throw "WiX Toolset not found after installation"
          }
          "$($wix.FullName)\bin" >> $env:GITHUB_PATH
          Write-Host "WiX added to PATH: $($wix.FullName)\bin"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(grep 'val appReleaseVersion' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=EmbyDownload $VERSION" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=EmbyDownload $VERSION (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: .\gradlew.bat test --no-daemon

      - name: Build portable package
        run: .\gradlew.bat packagePortable packageTheater --no-daemon

      - name: Build Windows installer
        run: .\gradlew.bat jpackage --no-daemon

      - name: Collect artifact paths
        id: artifacts
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.app_version }}"
          PORTABLE="build/distributions/EmbyDownload-${VERSION}-portable-win.zip"
          if [[ ! -f "$PORTABLE" ]]; then
            echo "Portable package not found: $PORTABLE"
            exit 1
          fi
          echo "portable=$PORTABLE" >> "$GITHUB_OUTPUT"
          THEATER="build/distributions/EmbyDownload-${VERSION}-theater-plugin-win.zip"
          if [[ ! -f "$THEATER" ]]; then
            echo "Theater plugin package not found: $THEATER"
            exit 1
          fi
          echo "theater=$THEATER" >> "$GITHUB_OUTPUT"

          INSTALLER=$(find build/jpackage-out -maxdepth 1 -name "*.exe" -print -quit)
          if [[ -z "$INSTALLER" || ! -f "$INSTALLER" ]]; then
            echo "Installer exe not found under build/jpackage-out"
            exit 1
          fi
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.portable }}
            ${{ steps.artifacts.outputs.theater }}
            ${{ steps.artifacts.outputs.installer }}
